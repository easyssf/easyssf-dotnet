# Keeps the NuGet packages and the GitHub Actions current.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      identitymodel:
        patterns:
          - "Microsoft.IdentityModel.*"
      extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
