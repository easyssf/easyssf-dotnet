# Runs the receiver conformance tests of tests/EasySsf.Conformance.Tests against the OpenID conformance
# suite, which Testcontainers starts on the runner. One job per test plan, each with its own suite.
# See tests/EasySsf.Conformance.Receiver/README.md for the plans and the suite image.
name: Conformance

on:
  workflow_dispatch:
    inputs:
      suite-image:
        description: >-
          Conformance suite image. Empty: the one ConformanceSettings names.
        required: false
        default: ''
      nginx-image:
        description: >-
          Its nginx image. Empty: the one ConformanceSettings names.
        required: false
        default: ''
  # Later, once the harness has proven itself against a few releases: nightly.
  # schedule:
  #   - cron: '17 2 * * *'   # 02:17 UTC, every night

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        plan:
          - Ssf10PushReceiverConformanceTests
          - Ssf10PollReceiverConformanceTests
          - CaepInterop10PushReceiverConformanceTests
          - CaepInterop10PollReceiverConformanceTests
    name: ${{ matrix.plan }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run the ${{ matrix.plan }} plan
        env:
          EASYSSF_CONFORMANCE_TESTS: 'true'
          CTS_SUITE_IMAGE: ${{ inputs.suite-image }}
          CTS_SUITE_NGINX_IMAGE: ${{ inputs.nginx-image }}
        run: >-
          dotnet test tests/EasySsf.Conformance.Tests --configuration Release
          --filter "FullyQualifiedName~${{ matrix.plan }}"
          --logger "console;verbosity=normal" --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.plan }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
